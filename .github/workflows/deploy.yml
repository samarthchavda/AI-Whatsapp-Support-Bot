name: CI/CD Deploy to Production VPS

on:
  push:
    branches:
      - main # Trigger deployment when pushing to main branch

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install

      - name: Test React Frontend Build
        run: |
          cd frontend
          npm install
          CI=false npm run build

      - name: Test Next.js Public Build
        run: |
          cd next-public
          npm install
          CI=false npm run build

  deploy:
    needs: test-and-build # Run deployment only if tests & builds pass
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "🚀 Deploying Kwickbot to Server..."
            cd /home/ubuntu/whatsapp-bot
            
            # Reset local changes and pull latest code
            git reset --hard
            git pull origin main
            
            # 1. Install & build backend
            cd backend
            npm install --production
            
            # 2. Build React frontend dashboard
            cd ../frontend
            npm install
            NODE_OPTIONS="--max-old-space-size=1536" CI=false npm run build
            
            # 3. Build Next.js public website
            cd ../next-public
            npm install
            NODE_OPTIONS="--max-old-space-size=1536" CI=false npm run build
            
            # 4. Restart all PM2 services (whatsapp-ai-backend & next-public)
            pm2 restart all
            pm2 save
            
            echo "🎉 Deployment Completed Successfully!"
